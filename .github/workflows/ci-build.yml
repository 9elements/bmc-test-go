---
name: build
"on":
  pull_request:
  merge_group:
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: install taskfile
        uses: arduino/setup-task@v3
      - name: build
        run: |
          task build
      - name: validate example config
        run: |
           ./bin/bmc-test-go-linux-amd64-v0.0.0 cfg-check contrib/example_config.yaml
